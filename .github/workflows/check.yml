# kaguya.bat check のうち、実行環境を用意しやすい部分だけをPRごとに回す。
# Cargo build（Tauri）はRustツールチェーンとWindows SDKが要るため対象外。
# 実機確認は引き続き kaguya.bat check で行う。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # 本番はWindowsだが、Linuxの方が速く安い。Windows固有の問題（使用中ファイルを
    # 削除できない等）はLinuxでは再現しないため、両方で回す。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: install
        working-directory: backend
        run: python -m pip install -r requirements.txt
      # 設定・予定・Mindの保存先がPostgreSQLになったので、テストも実物を使う。
      # ランナーのPostgreSQLから使い捨てクラスタを1つ起動する（本番DBには触れない）。
      # KAGUYA_REQUIRE_DB は、DBが無いまま全部skipされて緑になるのを防ぐ。
      - name: unittest
        working-directory: backend
        env:
          KAGUYA_REQUIRE_DB: '1'
        run: python -B -m unittest discover -s tests

  frontend:
    # TypeScriptとNode上のテストだけなので、OSに依存しない。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      # READMEが原本。生成物のコミット漏れをここで止める（buildの前に見る）。
      - name: manual is generated from README
        working-directory: frontend
        run: node scripts/build-manual.mjs --check
      - name: tests
        working-directory: frontend
        run: node --test tests/*.test.cjs
      - name: build
        working-directory: frontend
        run: npm run build
