<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>かぐやAI</title>
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="かぐや" />
    <meta name="theme-color" content="#14101c" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui-polish.css" />
  </head>
  <body>
    <div id="app" class="mode-normal">
      <header class="toolbar">
        <nav class="tabbar" aria-label="画面切替">
          <button data-panel="chat" aria-pressed="true" aria-label="会話" title="会話"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a7 7 0 0 1-7 7H8l-4 3v-4.2A7 7 0 0 1 11 5h2a7 7 0 0 1 7 7Z"/></svg></button>
          <button data-panel="memories" aria-label="記憶" title="記憶"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v17l-5-4-5 4V4Z"/></svg></button>
          <button data-panel="pc" aria-label="ファイル" title="ファイル"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3V7Z"/><path d="M3 7V5h7l2 2"/></svg></button>
          <button data-panel="settings" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
        </nav>
        <div class="button-row">
          <button id="mini-toggle-btn" aria-label="簡易表示に切り替え" title="簡易表示に切り替え"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6H4M14 4v6h6"/></svg></button>
          <button id="quiet-btn" aria-pressed="false" aria-label="静かにする" title="静かにする"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16V11a6 6 0 1 0-12 0v5l-2 3h16l-2-3Z"/><path d="M10 22h4"/><path class="slash" d="M3 3l18 18"/></svg></button>
        </div>
      </header>
      <div id="controls-status" role="status" aria-live="polite"></div>
      <div class="chat-status-line"><span id="connection-status" role="status">接続中…</span><span id="chat-status" role="status"></span></div>
      <div id="character-view">
        <div id="avatar-frame"><canvas id="avatar" width="256" height="256"></canvas></div>
        <div id="proactive-bubble" role="status" hidden></div>
      </div>
      <div id="chat">
        <button id="older-btn" class="icon-button" type="button" hidden aria-label="以前の会話" title="以前の会話"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <div id="history"></div>
        <button id="latest-btn" class="icon-button" type="button" hidden aria-label="最新の返答へ" title="最新の返答へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div id="error" class="error" hidden></div>
        <p id="voice-status" role="status"></p>
        <form id="input-form">
          <textarea id="text-input" rows="1" maxlength="2000" aria-label="かぐやへのメッセージ" placeholder="かぐやに話しかける"></textarea>
          <div class="composer-actions">
            <!-- 通話の音量。通話中だけ出す。調整したいのは通話しているときだけ。 -->
            <div id="voice-volume" class="voice-volume" hidden>
              <button type="button" id="voice-mute" aria-label="消音する" title="消音する"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3.5L13 20V4L7.5 9H4Z"/><path d="M16.5 9.5c1 1 1 3 0 4"/><path d="M19 7c2.2 2.2 2.2 7.8 0 10"/></svg></button>
              <input type="range" id="voice-gain" min="0" max="100" step="5" value="100" aria-label="通話の音量" title="通話の音量">
            </div>
            <button type="button" id="voice-toggle" aria-label="音声通話を開始" title="音声通話を開始"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.5 10 7.8 8.4 10c1.2 2.4 3.2 4.4 5.6 5.6l2.2-1.6 4.3 2.8-.7 3.2c-.2.8-.9 1.4-1.8 1.4C10.2 21.4 2.6 13.8 2.6 6c0-.9.6-1.6 1.4-1.8l3.2-.7Z"/></svg></button>
            <button type="submit" id="send-btn" aria-label="送信" title="送信"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5 12l7-7 7 7"/></svg></button>
            <button type="button" id="cancel-btn" aria-label="生成を停止" title="生成を停止" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
          </div>
        </form>
      </div>
      <section id="settings-panel" class="panel" hidden>
        <h1>設定</h1>
        <section class="group">
          <h2>予約</h2>
          <div class="group-card"><div id="reminder-list"></div></div>
          <p class="group-footer">「明日8時に教えて」と話しかけると、ここに予約が並びます。</p>
        </section>
        <section class="group">
          <h2>記憶整理</h2>
          <div class="group-card">
            <div class="row">
              <span class="row-title">今すぐ整理する</span>
              <button id="organize-btn" type="button">実行</button>
            </div>
            <p id="job-status" class="row-note" role="status"></p>
          </div>
          <p class="group-footer">会話を長期記憶へまとめます。ふだんは会話のない時間に自動で行います。</p>
        </section>
        <section class="group">
          <h2>アプリについて</h2>
          <div class="group-card">
            <button type="button" class="row row-link" data-panel="help">
              <span class="row-title">使い方を見る</span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <p id="model-info" class="row-note"></p>
          </div>
        </section>
      </section>
      <section id="memories-panel" class="panel" hidden>
        <h1>記憶</h1>
        <p id="memory-summary" role="status"></p>
        <details id="recent-memories"><summary>最近の更新</summary><ul id="recent-memory-list"></ul></details>
        <form id="memory-filter" class="button-row">
          <select id="memory-layer" aria-label="記憶の種類"><option value="wisdom">覚えていること</option><option value="persona">接し方</option><option value="mind">かぐやの心</option><option value="raw">会話履歴</option></select>
          <input id="memory-search" type="search" maxlength="200" placeholder="検索" aria-label="記憶を検索">
          <button type="submit" class="icon-button" aria-label="表示・更新" title="表示・更新"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></button>
        </form>
        <div id="memory-list"></div>
        <div class="button-row"><button id="memory-prev" class="icon-button" disabled aria-label="前へ" title="前へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><span id="memory-page"></span><button id="memory-next" class="icon-button" disabled aria-label="次へ" title="次へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </section>
      <section id="help-panel" class="panel" hidden>
        <button type="button" class="back-link" data-panel="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>設定</button>
        <iframe title="かぐやAI 操作マニュアル" src="/manual.html"></iframe>
      </section>
      <section id="pc-panel" class="panel" hidden>
        <h1>ファイル</h1>
        <form id="pc-filter" class="search-bar">
          <input id="pc-search" type="search" maxlength="200" placeholder="ファイル名・フォルダ名で検索" aria-label="PC内の動画を検索">
          <button type="submit" class="icon-button" aria-label="検索" title="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></button>
        </form>
        <div id="pc-player" hidden>
          <video id="pc-video" controls playsinline preload="none"></video>
          <p id="pc-now-playing" class="row-note"></p>
        </div>
        <div id="pc-files"></div>
        <p id="pc-status" class="hint" role="status"></p>
        <div class="button-row pager"><button id="pc-prev" class="icon-button" disabled aria-label="前へ" title="前へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><span id="pc-page"></span><button id="pc-next" class="icon-button" disabled aria-label="次へ" title="次へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
        <section class="group" id="pc-commands-group" hidden>
          <h2>登録した操作</h2>
          <div class="group-card" id="pc-commands"></div>
          <ul id="pc-jobs" class="group-footer"></ul>
        </section>
        <section class="group">
          <h2>iPhoneから開く</h2>
          <div class="group-card"><p id="pc-remote" class="row-note"></p></div>
        </section>
      </section>
    </div>
    <dialog id="memory-dialog">
      <h2 id="dialog-title"></h2><p id="dialog-description"></p>
      <textarea id="memory-value" rows="6" aria-label="訂正後の記憶" hidden></textarea>
      <label id="memory-lock-label" hidden><input id="memory-lock" type="checkbox" checked>自動更新しない</label>
      <p id="dialog-error" role="alert"></p>
      <div class="button-row"><button id="dialog-cancel" class="icon-button" aria-label="キャンセル" title="キャンセル"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><button id="dialog-confirm" class="icon-button" aria-label="確認して実行" title="確認して実行"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></button></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/living.ts"></script>
  </body>
</html>
